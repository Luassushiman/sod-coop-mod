; State of Decay: Year-One - Co-op Mod
; Coloque este arquivo na pasta do jogo, ao lado do StateOfDecay.exe e da dinput8.dll.

[general]
; 0 = mod desligado (o jogo roda normal, sem co-op, mesmo com a DLL na pasta)
enabled=1

[net]
; Quem cria a partida: role=host. Quem entra: role=client.
role=host
; Como os dois se conectam:
;   steam = pela rede da Steam, sem abrir porta (recomendado pela internet).
;           Cada um poe em steam_peer o SteamID64 do OUTRO. O seu aparece no log do mod
;           (linha "seu SteamID64 = ..."), e tambem em sites como steamid.io.
;   udp   = direto por IP e porta (rede local, ou internet com a porta liberada).
transport=steam
steam_peer=0
; (so transport=udp) HOST: deixe 0.0.0.0 para aceitar o amigo pela rede local ou pela internet.
bind=0.0.0.0
; (so transport=udp) CLIENT: coloque aqui o IP do host (rede local, ex.: 192.168.0.10, ou o IP publico dele).
host=127.0.0.1
; Porta UDP (a mesma nos dois). Pela internet, o host precisa liberar esta porta UDP no roteador.
port=27650
; (CLIENT) 1 = ao conectar, ainda no menu, recebe o save do Breakdown do host (com backup do seu
; save em sodcoop_save_backups). Espere o aviso no canto da tela antes de clicar em Continuar.
sync_save=1

[window]
; 0 = o jogo usa a propria janela/resolucao (normal).
width=0
height=0
